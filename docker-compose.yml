# Local development database only. The backend runs with `uv run uvicorn` and the
# frontend with `pnpm -C frontend dev`; neither is containerized here (the application
# image is Day 7 scope). Milvus Lite is an embedded file (milvus.db), not a service.
#
#   docker compose up -d      # start; creates `nutrition` and `nutrition_test`
#   docker compose down -v    # reset: drops every table and enum type (see alembic/)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
      POSTGRES_DB: nutrition
    ports:
      # Loopback only: a dev database with a committed password must not be reachable
      # from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume: creates the test database that
      # tests/conftest.py binds to through TEST_DATABASE_URL.
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition -d nutrition"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
