# Knowledge-base manifest: provenance for every document in this directory.
#
# Every entry is the citation shown to users (hard rule 5), so `source` and `year` must
# be accurate. Documents are hand-condensed paraphrases of the named guideline, not
# copies. `age_min_months`/`age_max_months` (0-60) drive the age filter in advanced RAG:
# use the range the guidance actually applies to, and 0-60 for general guidance.
#
# authority must be one of: WHO | AAP | CDC | USDA/HHS | NIH | FDA/EPA
#
# To add a document: drop the .md file here, add an entry, run `uv run scripts/ingest.py`.
