# Evaluation test set (reference §12; rag-evaluation spec). 55 cases, seven categories.
#
# Routing of categories to endpoints (design.md Decision 2):
#   rag_basic, rag_advanced, out_of_domain -> POST /api/ask, once per strategy
#   tool, hybrid, user_data, adversarial   -> POST /api/chat under a throwaway account,
#                                             with `child` saved and `feeding_log` logged first
#
# Expectations: `documents` = any-of document ids that must appear among the citations;
# `intent` / `tools` = what the chat must route to and run with status ok; `no_answer` =
# the fixed no-answer message is the correct outcome; `reference` = a hand-written answer
# drawn from the named `reference_source`; `must_include` / `must_not_include` =
# case-insensitive phrases. Feeding-log entries use `days_ago` + `time` so the set stays
# stable over time.

fixtures:
  infant_8mo:
    age_months: 8
    weight_kg: 8.5
    sex: female
    height_cm: 69
    diet_preference: omnivore
    allergies: [peanut]
    activity_level: low_active
  toddler_30mo:
    age_months: 30
    weight_kg: 13.5
    sex: male
    height_cm: 92
    diet_preference: omnivore
    allergies: []
    activity_level: active
  infant_4mo:
    age_months: 4
    weight_kg: 6.4
    sex: male
    height_cm: 62
    diet_preference: omnivore
    allergies: []
    activity_level: low_active
  day_of_feeds:
    - {days_ago: 0, time: "07:30", feeding_type: formula, quantity: 180, unit: ml}
    - {days_ago: 0, time: "11:00", feeding_type: solid, food_id: infant_cereal_iron_fortified, quantity: 30, unit: g}
    - {days_ago: 0, time: "14:00", feeding_type: formula, quantity: 150, unit: ml}
  four_days_of_feeds:
    - {days_ago: 3, time: "07:30", feeding_type: formula, quantity: 180, unit: ml}
    - {days_ago: 3, time: "12:00", feeding_type: solid, food_id: infant_cereal_iron_fortified, quantity: 30, unit: g}
    - {days_ago: 3, time: "18:00", feeding_type: formula, quantity: 180, unit: ml}
    - {days_ago: 2, time: "07:30", feeding_type: formula, quantity: 180, unit: ml}
    - {days_ago: 2, time: "12:00", feeding_type: solid, food_id: avocado, quantity: 40, unit: g}
    - {days_ago: 2, time: "18:00", feeding_type: formula, quantity: 150, unit: ml}
    - {days_ago: 1, time: "07:30", feeding_type: formula, quantity: 180, unit: ml}
    - {days_ago: 1, time: "12:00", feeding_type: solid, food_id: infant_cereal_iron_fortified, quantity: 30, unit: g}
    - {days_ago: 1, time: "18:00", feeding_type: formula, quantity: 180, unit: ml}
    - {days_ago: 0, time: "07:30", feeding_type: formula, quantity: 180, unit: ml}

cases:
  # ---------------------------------------------------------------- rag_basic (12)
  - id: rag-iron-8mo
    category: rag_basic
    question: How much iron does an 8-month-old need each day?
    expect:
      documents: [aap-iron-deficiency-2010, nih-dri-micronutrients]
      reference: Infants 7 to 12 months need 11 mg of iron per day (the RDA), the highest requirement per kilogram at any age; iron-fortified cereal, pureed meat, poultry, fish and legumes are the food sources, and breastfed infants may need a 1 mg/kg supplement from 4 months until iron-rich foods are established.
      reference_source: aap-iron-deficiency-2010
      must_include: ["11 mg"]
  - id: rag-start-solids
    category: rag_basic
    question: When should I start giving my baby solid foods?
    expect:
      documents: [cdc-introducing-solid-foods, who-complementary-feeding-2023, dga-2020-2025-birth-to-24-months]
      reference: Most babies are ready for solid foods at about 6 months, and not before 4 months; readiness signs include sitting with support, holding the head steady, opening the mouth for food and swallowing rather than pushing it out. Breast milk or formula remains the main nutrition through the first year.
      reference_source: cdc-introducing-solid-foods
      must_include: ["6 months"]
  - id: rag-choking-hazards
    category: rag_basic
    question: Which foods are choking hazards for toddlers?
    expect:
      documents: [aap-choking-prevention-2010]
      reference: For children under 4 the high-risk foods are hot dogs, whole grapes, nuts and seeds, hard or sticky candy, popcorn, chunks of meat or cheese, raw hard vegetables, spoonfuls of nut butter and hard fruit chunks; cut round foods lengthwise, cook hard vegetables soft, and always supervise eating.
      reference_source: aap-choking-prevention-2010
      must_include: ["grapes"]
  - id: rag-honey-9mo
    category: rag_basic
    question: Is honey safe for my 9 month old?
    expect:
      documents: [cdc-honey-and-infant-botulism]
      reference: No. Honey should not be given to a child younger than 12 months in any form or amount — raw, pasteurised, baked into foods or on a pacifier — because it can contain Clostridium botulinum spores that cause infant botulism.
      reference_source: cdc-honey-and-infant-botulism
      must_include: ["12 months"]
      must_not_include: ["honey is safe"]
  - id: rag-apple-juice-10mo
    category: rag_basic
    question: Can I give my 10-month-old apple juice?
    expect:
      documents: [aap-fruit-juice-2017, aap-healthy-beverages-milk-2019]
      reference: Fruit juice should not be given to infants under 1 year unless a clinician advises it; it adds sugar, promotes tooth decay and can displace milk and nutrient-rich foods. Breast milk or formula and, from 6 months, small amounts of water are the only drinks an infant needs.
      reference_source: aap-fruit-juice-2017
      must_include: ["1 year|12 months"]
  - id: rag-vitamin-d-newborn
    category: rag_basic
    question: Does a breastfed newborn need vitamin D drops?
    expect:
      documents: [aap-vitamin-d-2008]
      reference: Yes. Human milk contains very little vitamin D, so breastfed and partially breastfed infants should receive 400 IU of vitamin D per day starting in the first days of life, continued until weaned to at least a litre a day of fortified formula or, after 12 months, fortified milk.
      reference_source: aap-vitamin-d-2008
      must_include: ["400 IU"]
  - id: rag-peanut-introduction
    category: rag_basic
    question: When should I introduce peanut butter to reduce allergy risk?
    expect:
      documents: [aap-allergenic-foods-2019]
      reference: Infants with no eczema or food allergy can have peanut-containing foods freely with other complementary foods from about 6 months; those with mild to moderate eczema around 6 months at home; those with severe eczema or egg allergy as early as 4–6 months but only after clinician evaluation. Peanut butter should be thinned, never a spoonful.
      reference_source: aap-allergenic-foods-2019
      must_include: ["6 months"]
  - id: rag-protein-2yo
    category: rag_basic
    question: How much protein does a 2 year old need per day?
    expect:
      documents: [nih-dri-energy-and-protein]
      reference: The RDA for children 1–3 years is 1.05 g of protein per kilogram of body weight per day, about 13 g per day for a reference-size child.
      reference_source: nih-dri-energy-and-protein
      must_include: ["13 g"]
  - id: rag-growth-percentiles
    category: rag_basic
    question: What do the percentiles on my child's growth chart mean?
    expect:
      documents: [cdc-growth-charts-and-bmi, who-child-growth-standards-2006]
      reference: A percentile is the percentage of children of the same age and sex who are smaller; the 50th is the median, and the 10th or 90th is normal for many children. Consistency over time matters more than any single point; crossing two major percentile lines or a flat weight line prompts a clinical review.
      reference_source: cdc-growth-charts-and-bmi
      must_include: ["50th"]
  - id: rag-fish-mercury
    category: rag_basic
    question: Which fish are safe for young children and which have too much mercury?
    expect:
      documents: [fda-epa-fish-advice-2021]
      reference: Best choices include salmon, cod, haddock, pollock, tilapia, sardines, canned light tuna and shrimp, served 1–2 times a week in child-sized portions; avoid king mackerel, marlin, orange roughy, shark, swordfish, Gulf tilefish and bigeye tuna, and limit albacore tuna to one serving a week.
      reference_source: fda-epa-fish-advice-2021
      must_include: ["swordfish"]
  - id: rag-vegan-toddler
    category: rag_basic
    question: Can a vegan diet be healthy for a toddler?
    expect:
      documents: [aap-vegetarian-and-vegan-diets]
      reference: Yes, when well planned. Vegan children need a reliable vitamin B12 source, attention to iron (with vitamin C), zinc, calcium and vitamin D, energy-dense foods because plant diets are bulky, and fortified unsweetened soy milk as the milk after 12 months; growth on the chart is the best check.
      reference_source: aap-vegetarian-and-vegan-diets
      must_include: ["B12"]
  - id: rag-unpasteurized
    category: rag_basic
    question: Is unpasteurized milk or soft cheese safe for a toddler?
    expect:
      documents: [cdc-food-safety-unpasteurized-and-storage]
      reference: No. Never give raw (unpasteurised) milk or soft cheeses made from raw milk to young children; their immature immune systems make Salmonella, E. coli O157 and Listeria infections far more dangerous. Choose products labelled pasteurised.
      reference_source: cdc-food-safety-unpasteurized-and-storage
      must_not_include: ["is safe"]

  # ------------------------------------------------------------- rag_advanced (10)
  - id: adv-cows-milk-start
    category: rag_advanced
    question: When can my baby start drinking cow's milk?
    expect:
      documents: [aap-healthy-beverages-milk-2019, aap-iron-deficiency-2010, cdc-introducing-solid-foods]
      reference: Whole cow's milk becomes an appropriate drink at 12 months, about 2–3 cups a day; before that it is low in iron, can cause intestinal blood loss and reduces iron absorption. Small amounts in cooked foods are acceptable from 6 months.
      reference_source: aap-healthy-beverages-milk-2019
      must_include: ["12 months"]
  - id: adv-toddler-water
    category: rag_advanced
    question: How much water should a toddler drink?
    expect:
      documents: [aap-hydration-and-water, aap-healthy-beverages-milk-2019]
      reference: About 1 to 4 cups (240–960 ml) of plain water a day for a 1–3-year-old, alongside 2–3 cups of milk, rising with heat, activity and illness; offer water at every meal and snack in an open or straw cup.
      reference_source: aap-hydration-and-water
      must_include: ["cups"]
  - id: adv-exclusive-breastfeeding
    category: rag_advanced
    question: How long should I breastfeed exclusively?
    expect:
      documents: [who-breastfeeding-recommendations, dga-2020-2025-birth-to-24-months]
      reference: WHO recommends exclusive breastfeeding — only breast milk, not even water — for the first 6 months, then continued breastfeeding to 2 years or beyond alongside complementary foods.
      reference_source: who-breastfeeding-recommendations
      must_include: ["6 months"]
  - id: adv-milk-40oz-14mo
    category: rag_advanced
    question: My 14-month-old drinks about 40 ounces of whole milk a day. Is that too much?
    expect:
      documents: [aap-healthy-beverages-milk-2019, aap-iron-deficiency-2010]
      reference: Yes. Toddlers should have about 16–24 ounces (2–3 cups) of milk a day; well over 24 ounces fills them up, displaces iron-rich foods and raises the risk of iron-deficiency anaemia and constipation.
      reference_source: aap-healthy-beverages-milk-2019
      must_include: ["24"]
  - id: adv-five-months-cereal-water
    category: rag_advanced
    question: My baby is 5 months old. Can I start rice cereal, and should I give water with it?
    expect:
      documents: [cdc-introducing-solid-foods, aap-hydration-and-water, aap-healthy-beverages-milk-2019]
      reference: Most babies are ready for solids at about 6 months and not before 4; when starting, choose iron-fortified cereals such as oat or barley rather than rice cereal exclusively. Water is not needed before about 6 months and can be harmful in young infants; once solids begin, 4–8 ounces a day in a cup is enough.
      reference_source: cdc-introducing-solid-foods
      must_not_include: ["rice cereal is the best first food"]
  - id: adv-20mo-daily-pattern
    category: rag_advanced
    question: Roughly how much fruit, vegetables and dairy should my 20-month-old eat in a day?
    expect:
      documents: [dga-2020-2025-birth-to-24-months]
      reference: For toddlers 12–23 months no longer on breast milk or formula, about ⅔ to 1 cup of vegetables, ½ to 1 cup of fruit, 1⅔ to 2 cups of dairy, 1¾ to 3 ounce-equivalents of grains and 2 ounce-equivalents of protein foods a day, within roughly 700–1,000 calories; amounts are daily targets, not per meal.
      reference_source: dga-2020-2025-birth-to-24-months
      must_include: ["cup"]
  - id: adv-3yo-calories-sugar
    category: rag_advanced
    question: How many calories does a 3-year-old need, and how much added sugar is allowed?
    expect:
      documents: [dga-2020-2025-children-2-to-4, nih-dri-energy-and-protein]
      reference: Children 2–3 need roughly 1,000–1,400 calories a day depending on size and activity, and added sugars should be under 10% of calories — under about 30 g (7 teaspoons) on a 1,200-calorie diet.
      reference_source: dga-2020-2025-children-2-to-4
      must_include: ["10%"]
  - id: adv-breast-milk-storage
    category: rag_advanced
    question: How long can I keep expressed breast milk in the fridge, and can I refreeze thawed milk?
    expect:
      documents: [cdc-food-safety-unpasteurized-and-storage]
      reference: Freshly expressed milk keeps up to 4 hours at room temperature, up to 4 days in the refrigerator and best within 6 months in the freezer; thawed milk should be used within 24 hours in the refrigerator and never refrozen.
      reference_source: cdc-food-safety-unpasteurized-and-storage
      must_include: ["4 days"]
      must_not_include: ["can be refrozen"]
  - id: adv-formula-water-temp-newborn
    category: rag_advanced
    question: What water temperature should I use to make up powdered formula for my 6-week-old?
    expect:
      documents: [cdc-food-safety-unpasteurized-and-storage]
      reference: For infants under 3 months, prepare powdered formula with water heated to at least 158°F (70°C) — boiled and cooled no more than 30 minutes — then cool the bottle to feeding temperature, because powdered formula is not sterile and can contain Cronobacter. Never dilute or concentrate formula.
      reference_source: cdc-food-safety-unpasteurized-and-storage
      must_include: ["70"]
  - id: adv-peanut-severe-eczema
    category: rag_advanced
    question: My 5-month-old has severe eczema. When and how should peanut be introduced?
    expect:
      documents: [aap-allergenic-foods-2019]
      reference: 'Infants with severe eczema or egg allergy are high risk: peanut-containing foods can be introduced as early as 4–6 months, but only after evaluation by a clinician (peanut-specific IgE and/or skin-prick test) and, if indicated, a supervised first feeding; once tolerated, about 2 g of peanut protein three times a week maintains tolerance.'
      reference_source: aap-allergenic-foods-2019
      must_include: ["clinician"]

  # --------------------------------------------------------------------- tool (8)
  - id: tool-bmi
    category: tool
    question: What is her BMI?
    child: infant_8mo
    expect:
      intent: tool
      tools: [calculate_bmi]
  - id: tool-calories
    category: tool
    question: How many calories should she have in a day?
    child: infant_8mo
    expect:
      intent: tool
      tools: [calculate_calorie_target]
  - id: tool-protein
    category: tool
    question: How much protein does she need each day?
    child: infant_8mo
    expect:
      intent: tool
      tools: [calculate_protein_target]
  - id: tool-food-lookup
    category: tool
    question: What nutrients are in a serving of avocado from your food table?
    child: infant_8mo
    expect:
      intent: tool
      tools: [lookup_food]
  - id: tool-food-lookup-quantity
    category: tool
    question: What are the nutritional values for 20 grams of sweet potatoes?
    child: infant_8mo
    expect:
      intent: tool
      tools: [lookup_food]
  - id: tool-meal-nutrition
    category: tool
    question: How many calories and how much protein are in 150 ml of iron-fortified infant formula plus 30 g of iron-fortified infant cereal?
    child: infant_8mo
    expect:
      intent: tool
      tools: [calculate_meal_nutrition]
  - id: tool-meal-plan
    category: tool
    question: Plan a day of meals for her.
    child: infant_8mo
    expect:
      intent: tool
      tools: [generate_meal_plan]
      plan_must_not_include: [peanut, honey]
  - id: tool-toddler-calories
    category: tool
    question: What's his daily calorie target?
    child: toddler_30mo
    expect:
      intent: tool
      tools: [calculate_calorie_target]
  - id: tool-toddler-meal-plan
    category: tool
    question: Give me a day of meals for him.
    child: toddler_30mo
    expect:
      intent: tool
      tools: [generate_meal_plan]
      plan_must_not_include: [grapes, popcorn, hot dog, whole nuts]

  # ------------------------------------------------------------------- hybrid (6)
  - id: hybrid-protein-foods
    category: hybrid
    question: How much protein does she need a day, and which first foods are good sources?
    child: infant_8mo
    expect:
      intent: hybrid
      tools: [calculate_protein_target]
      documents: [nih-dri-energy-and-protein, who-complementary-feeding-2023, cdc-introducing-solid-foods]
      reference: At 7–12 months the protein RDA is 1.2 g per kilogram a day (about 10 g for an 8.5 kg infant); pureed meat, poultry, fish, egg, yoghurt, beans and lentils supply protein along with iron and zinc.
      reference_source: nih-dri-energy-and-protein
  - id: hybrid-calories-guidelines
    category: hybrid
    question: How many calories does he need, and what do the dietary guidelines say about added sugar at his age?
    child: toddler_30mo
    expect:
      intent: hybrid
      tools: [calculate_calorie_target]
      documents: [dga-2020-2025-children-2-to-4, nih-dri-energy-and-protein]
      reference: A 2–3-year-old needs roughly 1,000–1,400 calories depending on size and activity, following a pattern of 1–1½ cups vegetables, 1–1½ cups fruit, 3–5 ounce-equivalents of grains, 2–2½ cups low-fat dairy and 2–4 ounce-equivalents of protein foods, with added sugars under 10% of calories.
      reference_source: dga-2020-2025-children-2-to-4
  - id: hybrid-bmi-meaning
    category: hybrid
    question: What's her BMI, and what does BMI actually mean for a baby?
    child: infant_8mo
    expect:
      intent: hybrid
      tools: [calculate_bmi]
      documents: [cdc-growth-charts-and-bmi, who-child-growth-standards-2006]
      reference: BMI is weight in kg divided by height in metres squared, but in children it is meaningful only as a percentile for age and sex; adult cut-offs do not apply, and under 2 years weight-for-length is used instead.
      reference_source: cdc-growth-charts-and-bmi
  - id: hybrid-plan-with-allergy
    category: hybrid
    question: Plan today's meals for her, and remind me how to introduce other allergenic foods safely given her peanut allergy.
    child: infant_8mo
    expect:
      intent: hybrid
      tools: [generate_meal_plan]
      documents: [aap-allergenic-foods-2019]
      reference: Introduce one new allergenic food at a time, a few days apart, at home early in the day when the child is well, and watch for two hours; an infant already diagnosed with a food allergy should have an individualised plan from a clinician or allergist.
      reference_source: aap-allergenic-foods-2019
      plan_must_not_include: [peanut]
  - id: hybrid-iron-plan
    category: hybrid
    question: Plan a day of meals for her that covers iron, and tell me why iron matters at her age.
    child: infant_8mo
    expect:
      intent: hybrid
      tools: [generate_meal_plan]
      documents: [aap-iron-deficiency-2010, nih-dri-micronutrients]
      reference: Iron needs peak at 7–12 months (11 mg/day) as birth stores run out; iron is needed for haemoglobin, growth and brain development, and deficiency in infancy is linked to lasting effects on cognition. Iron-fortified cereal, pureed meat and legumes are the key first foods.
      reference_source: aap-iron-deficiency-2010
  - id: hybrid-milk-amount-toddler
    category: hybrid
    question: How much milk should he drink a day, and does that fit his calorie target?
    child: toddler_30mo
    expect:
      intent: hybrid
      tools: [calculate_calorie_target]
      documents: [aap-healthy-beverages-milk-2019, dga-2020-2025-children-2-to-4]
      reference: At 2–5 years about 2 to 2½ cups (16–20 ounces) of low-fat milk a day; more than about 24 ounces displaces iron-rich foods.
      reference_source: aap-healthy-beverages-milk-2019

  # ---------------------------------------------------------------- user_data (6)
  - id: user-today-intake
    category: user_data
    question: What has she had to eat and drink so far today?
    child: infant_8mo
    feeding_log: day_of_feeds
    expect:
      intent: tool
      tools: [get_daily_nutrition]
  - id: user-remaining-today
    category: user_data
    question: How many calories does she still need today?
    child: infant_8mo
    feeding_log: day_of_feeds
    expect:
      intent: tool
      tools: [get_remaining_targets]
  - id: user-gaps
    category: user_data
    question: Has she been getting enough iron over the last few days?
    child: infant_8mo
    feeding_log: four_days_of_feeds
    expect:
      intent: tool
      tools: [detect_nutrient_gaps]
  - id: user-log-feed
    category: user_data
    question: Log that she just had 120 ml of formula.
    child: infant_8mo
    feeding_log: day_of_feeds
    expect:
      intent: tool
      tools: [log_feeding]
  - id: user-plan-rest-of-day
    category: user_data
    question: Plan the rest of today's meals for her based on what she's already had.
    child: infant_8mo
    feeding_log: day_of_feeds
    expect:
      intent: tool
      tools: [generate_meal_plan]
  - id: user-gaps-no-log
    category: user_data
    question: Have her recent days been on track for calories and protein?
    child: infant_8mo
    expect:
      intent: tool
      tools: [detect_nutrient_gaps]

