# Render blueprint (Day 7, production-hardening spec): one Docker web service for the API
# and one managed PostgreSQL. The frontend is a separate Vercel project (root `frontend/`,
# BACKEND_URL set to this service's URL); see README.md "Deployment".
#
# Secrets: SESSION_SECRET is generated by Render on first deploy; OPENROUTER_API_KEY is
# entered in the dashboard (sync: false) and never lives in this file.
services:
  - type: web
    name: nutrition-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    # One instance by design: the rate limiter is per process, and start.sh runs the
    # schema migration before serving.
    numInstances: 1
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        # Render's internal URL (postgres://...); backend/core/config.py normalises the
        # scheme to asyncpg.
        fromDatabase:
          name: nutrition-db
          property: connectionString
      - key: APP_ENV
        value: prod
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      # Empty: the browser reaches the API through the Vercel same-origin /api rewrite.
      - key: ALLOWED_ORIGINS
        value: ""
      - key: RATE_LIMIT_MODEL_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_ADMIN_PER_MINUTE
        value: "30"
      # Comma-separated emails allowed to edit the food table; set in the dashboard.
      - key: ADMIN_EMAILS
        sync: false
      - key: MILVUS_DB_PATH
        value: /data/milvus.db
    # Optional, paid plans only: keep the Milvus Lite file across deploys and restarts so
    # start.sh embeds nothing. Without it the corpus (20 documents) is re-embedded on start.
    # disk:
    #   name: nutrition-data
    #   mountPath: /data
    #   sizeGB: 1

databases:
  - name: nutrition-db
    plan: free
    region: frankfurt
    databaseName: nutrition
    user: nutrition
