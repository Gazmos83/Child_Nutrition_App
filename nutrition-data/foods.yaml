# Food-composition table for the deterministic nutrient tools (Day 4).
#
# This file seeds the database (food_table_revisions, revision 1). Once the migration has
# run, the served table is edited through the admin page (/admin/foods) and stored as further
# revisions; editing this file changes only what a fresh database is seeded with.
#
# Every nutrient number a meal plan reports is a sum over rows in this file; the language
# model never computes or guesses one. Values are rounded typical figures per the stated
# serving, taken from USDA FoodData Central unless an entry names its own `source`.
# Serving sizes are infant/toddler portions, not adult ones.
#
# Safety metadata drives the hard-coded infant-safety filter (hard rule 4):
#   allergens               - the regulatory "big nine" (backend.models.enums.Allergen)
#   choking_hazard          - on the AAP Prevention of Choking (2010) high-risk list for <4 y
#   contains_honey          - excluded under 12 months (CDC infant botulism guidance)
#   commonly_unpasteurized  - excluded at every age (CDC food-safety guidance for <5 y)
#   min_age_months          - 0 only for breast milk and formula; every solid is >= 6
#                             (WHO/AAP complementary feeding from about 6 months); cow's
#                             milk as a drink and juice are 12 (AAP/DGA)
#
# Unsafe foods are deliberately present, flagged, so the filter is exercised against real
# entries rather than trusted to work on an empty set.
#
# Validation: backend/nutrition/foods.py rejects the whole file on any invalid entry.

version: "2026-08-26.1"
source: "USDA FoodData Central, SR Legacy and Foundation Foods (values rounded, per stated serving)"

